<svg width="2000" height="900" viewBox="0 0 2000 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="2000" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070707"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="panel" x1="980" y1="120" x2="1850" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161616"/>
      <stop offset="1" stop-color="#0E0E0E"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity=".35"/>
    </filter>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .muted{fill:#A5A5A5}
      .line{stroke:#3B3B3B;stroke-width:1.5}
      .tiny{font-size:15px;letter-spacing:3px}
      .label{font-size:17px;letter-spacing:3px;font-weight:700}
      .tool{font-size:17px;fill:#161616}
      .code{font-size:18px}
    </style>
  </defs>

  <!-- HERO -->
  <rect width="2000" height="700" fill="url(#bg)"/>
  <path d="M0 0H320L0 320V0Z" fill="#101010"/>
  <circle cx="-20" cy="30" r="160" stroke="#2C2C2C" stroke-width="2"/>
  <circle cx="1880" cy="-30" r="180" fill="#151515"/>

  <!-- subtle grid right -->
  <g opacity=".22" stroke="#4A4A4A">
    <path d="M980 0V700M1040 0V700M1100 0V700M1160 0V700M1220 0V700M1280 0V700M1340 0V700M1400 0V700M1460 0V700M1520 0V700M1580 0V700M1640 0V700M1700 0V700M1760 0V700M1820 0V700M1880 0V700M1940 0V700"/>
    <path d="M960 60H2000M960 120H2000M960 180H2000M960 240H2000M960 300H2000M960 360H2000M960 420H2000M960 480H2000M960 540H2000M960 600H2000M960 660H2000"/>
  </g>

  <!-- LEFT IDENTITY -->
  <g class="sans">
    <line x1="82" y1="170" x2="175" y2="170" stroke="#F1F1F1" stroke-width="2"/>
    <text x="205" y="176" fill="#A7A7A7" class="tiny">BUILD · LEARN · CREATE</text>

    <text x="78" y="335" fill="#F4F4F4" font-size="78" font-weight="300">Syed</text>
    <text x="78" y="455" fill="#FFFFFF" font-size="142" font-weight="800" letter-spacing="-6">Atif Hussain</text>

    <text x="82" y="515" fill="#D7D7D7" font-size="28" letter-spacing="8">FULL-STACK DEVELOPER</text>
    <line x1="525" y1="486" x2="525" y2="518" stroke="#777"/>
    <text x="566" y="515" fill="#D7D7D7" font-size="28" letter-spacing="8">AI/ML STUDENT</text>

    <!-- meta -->
    <g transform="translate(84 585)">
      <!-- pin -->
      <path d="M18 1C8 1 2 8.5 2 17c0 12 16 28 16 28s16-16 16-28C34 8.5 28 1 18 1Z" stroke="#F4F4F4" stroke-width="3"/>
      <circle cx="18" cy="17" r="5" fill="#F4F4F4"/>
      <text x="54" y="30" fill="#E7E7E7" font-size="24">Kolkata, India</text>

      <line x1="270" y1="2" x2="270" y2="42" stroke="#555"/>

      <!-- education -->
      <path d="M332 8l20-10 20 10-20 10-20-10Zm6 11v12c8 6 20 6 28 0V19" stroke="#F4F4F4" stroke-width="3" fill="none"/>
      <text x="390" y="30" fill="#E7E7E7" font-size="24">BCA — AI/ML</text>

      <line x1="585" y1="2" x2="585" y2="42" stroke="#555"/>

      <!-- laptop -->
      <rect x="645" y="3" width="30" height="21" rx="2" stroke="#F4F4F4" stroke-width="3"/>
      <path d="M640 29h40" stroke="#F4F4F4" stroke-width="3"/>
      <text x="700" y="30" fill="#E7E7E7" font-size="24">turning ideas into software</text>
    </g>
  </g>

  <!-- RIGHT CODE EDITOR -->
  <g filter="url(#softShadow)">
    <rect x="980" y="125" width="850" height="470" rx="20" fill="url(#panel)" stroke="#3A3A3A" stroke-width="2"/>
    <rect x="980" y="125" width="850" height="58" rx="20" fill="#171717"/>
    <rect x="980" y="163" width="850" height="20" fill="#171717"/>

    <!-- window controls -->
    <circle cx="1015" cy="154" r="8" fill="#FF6B5F"/>
    <circle cx="1042" cy="154" r="8" fill="#E8C35A"/>
    <circle cx="1069" cy="154" r="8" fill="#63C274"/>

    <!-- explorer -->
    <rect x="1000" y="184" width="220" height="390" fill="#121212"/>
    <text x="1025" y="215" class="sans" fill="#BEBEBE" font-size="16" font-weight="700">EXPLORER</text>

    <g class="sans" font-size="17" fill="#BDBDBD">
      <text x="1025" y="252">⌄  portfolio</text>
      <text x="1048" y="286">⌄  src</text>
      <text x="1070" y="319">›  components</text>
      <text x="1070" y="350">›  hooks</text>
      <text x="1070" y="381">›  pages</text>
      <text x="1070" y="412">›  assets</text>
      <rect x="1035" y="428" width="165" height="40" rx="4" fill="#242424"/>
      <text x="1070" y="454" fill="#F2F2F2">⚛  App.jsx</text>
      <text x="1070" y="490">#  index.css</text>
      <text x="1070" y="522">{ } package.json</text>
      <text x="1070" y="553">◇  vite.config.js</text>
    </g>

    <!-- tabs -->
    <rect x="1220" y="184" width="610" height="48" fill="#101010"/>
    <rect x="1220" y="184" width="178" height="48" fill="#1D1D1D"/>
    <text x="1240" y="215" class="sans" fill="#E5E5E5" font-size="16">⚛ App.jsx</text>
    <text x="1420" y="215" class="sans" fill="#8F8F8F" font-size="16"># index.css</text>
    <text x="1548" y="215" class="sans" fill="#8F8F8F" font-size="16">{ } package.json</text>

    <!-- code -->
    <g class="mono code">
      <g fill="#696969">
        <text x="1240" y="265">1</text><text x="1240" y="296">2</text><text x="1240" y="327">3</text>
        <text x="1240" y="358">4</text><text x="1240" y="389">5</text><text x="1240" y="420">6</text>
        <text x="1240" y="451">7</text><text x="1240" y="482">8</text><text x="1240" y="513">9</text>
        <text x="1230" y="544">10</text>
      </g>
      <text x="1285" y="265" fill="#D47B8E">import</text>
      <text x="1360" y="265" fill="#E9E9E9">{ useEffect }</text>
      <text x="1504" y="265" fill="#D47B8E">from</text>
      <text x="1568" y="265" fill="#7FC49B">'react'</text>

      <text x="1285" y="296" fill="#D47B8E">import</text>
      <text x="1360" y="296" fill="#E9E9E9">Hero</text>
      <text x="1410" y="296" fill="#D47B8E">from</text>
      <text x="1474" y="296" fill="#7FC49B">'./components/Hero'</text>

      <text x="1285" y="358" fill="#B992E5">function</text>
      <text x="1380" y="358" fill="#E8E8E8">App() {</text>

      <text x="1310" y="389" fill="#B992E5">useEffect</text>
      <text x="1420" y="389" fill="#E8E8E8">(() =&gt; {</text>

      <text x="1338" y="420" fill="#E8E8E8">document.title =</text>
      <text x="1525" y="420" fill="#7FC49B">"Syed Atif Hussain | Portfolio"</text>

      <text x="1310" y="451" fill="#E8E8E8">}, [])</text>
      <text x="1285" y="513" fill="#D47B8E">return</text>
      <text x="1360" y="513" fill="#E8E8E8">(</text>
      <text x="1310" y="544" fill="#E8845A">&lt;Hero /&gt;</text>
    </g>

    <!-- minimap -->
    <g opacity=".7">
      <rect x="1760" y="252" width="35" height="4" fill="#888"/>
      <rect x="1760" y="263" width="55" height="4" fill="#555"/>
      <rect x="1760" y="274" width="44" height="4" fill="#777"/>
      <rect x="1760" y="285" width="62" height="4" fill="#444"/>
      <rect x="1760" y="296" width="40" height="4" fill="#666"/>
      <rect x="1760" y="307" width="50" height="4" fill="#555"/>
