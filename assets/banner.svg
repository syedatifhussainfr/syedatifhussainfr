  <g class="sans">
    <text x="55" y="744" class="label" fill="#333">LANGUAGES —</text>
    <text x="555" y="744" class="label" fill="#333">FRONTEND —</text>
    <text x="1018" y="744" class="label" fill="#333">BACKEND —</text>
    <text x="1360" y="744" class="label" fill="#333">DATABASE —</text>
    <text x="1685" y="744" class="label" fill="#333">TOOLS —</text>
  </g>

  <!-- technology tiles -->
  <g class="sans">
    <!-- Languages -->
    <g transform="translate(55 770)">
      <g transform="translate(0 0)"><rect width="72" height="62" rx="14" fill="#F0F0F0"/><rect x="17" y="14" width="38" height="34" rx="4" fill="#111"/><text x="26" y="39" fill="#FFF" font-size="18" font-weight="700">JS</text><text x="6" y="92" class="tool">JavaScript</text></g>
      <g transform="translate(110 0)"><rect width="72" height="62" rx="14" fill="#F0F0F0"/><text x="22" y="42" fill="#111" font-size="34">Py</text><text x="8" y="92" class="tool">Python</text></g>
      <g transform="translate(220 0)"><rect width="72" height="62" rx="14" fill="#F0F0F0"/><text x="23" y="43" fill="#111" font-size="36" font-weight="800">C</text><text x="28" y="92" class="tool">C</text></g>
      <g transform="translate(330 0)"><rect width="72" height="62" rx="14" fill="#F0F0F0"/><text x="14" y="41" fill="#111" font-size="25" font-weight="800">C++</text><text x="20" y="92" class="tool">C++</text></g>
    </g>

    <!-- Frontend -->
    <g transform="translate(555 770)">
      <g><rect width="72" height="62" rx="14" fill="#F0F0F0"/><text x="17" y="41" fill="#111" font-size="28">⚛</text><text x="12" y="92" class="tool">React</text></g>
      <g transform="translate(110 0)"><rect width="72" height="62" rx="14" fill="#F0F0F0"/><path d="M20 14h34L36 48 20 14Z" fill="#111"/><text x="20" y="92" class="tool">Vite</text></g>
      <g transform="translate(220 0)"><rect width="72" height="62" rx="14" fill="#F0F0F0"/><text x="14" y="42" fill="#111" font-size="26" font-weight="800">H5</text><text x="12" y="92" class="tool">HTML</text></g>
      <g transform="translate(330 0)"><rect width="72" height="62" rx="14" fill="#F0F0F0"/><text x="14" y="42" fill="#111" font-size="26" font-weight="800">C3</text><text x="15" y="92" class="tool">CSS</text></g>
    </g>

    <!-- Backend -->
    <g transform="translate(1018 770)">
      <g><rect width="72" height="62" rx="14" fill="#F0F0F0"/><text x="10" y="41" fill="#111" font-size="22" font-weight="800">Node</text><text x="4" y="92" class="tool">Node.js</text></g>
      <g transform="translate(110 0)"><rect width="72" height="62" rx="14" fill="#F0F0F0"/><text x="18" y="41" fill="#111" font-size="28">ex</text><text x="5" y="92" class="tool">Express</text></g>
      <g transform="translate(220 0)"><rect width="72" height="62" rx="14" fill="#F0F0F0"/><path d="M36 16c15 0 22 7 22 15S51 46 36 46 14 39 14 31s7-15 22-15Zm0 7c-10 0-15 3-15 8s5 8 15 8 15-3 15-8-5-8-15-8Z" fill="#111"/><text x="2" y="92" class="tool">REST APIs</text></g>
    </g>

    <!-- Database -->
    <g transform="translate(1360 770)">
      <g><rect width="72" height="62" rx="14" fill="#F0F0F0"/><text x="10" y="40" fill="#111" font-size="18" font-weight="800">PG</text><text x="-5" y="92" class="tool">PostgreSQL</text></g>
      <g transform="translate(110 0)"><rect width="72" height="62" rx="14" fill="#F0F0F0"/><text x="12" y="40" fill="#111" font-size="18" font-weight="800">SQL</text><text x="8" y="92" class="tool">SQLite</text></g>
      <g transform="translate(220 0)"><rect width="72" height="62" rx="14" fill="#F0F0F0"/><path d="M18 22h36M18 31h36M18 40h36" stroke="#111" stroke-width="5"/><text x="-5" y="92" class="tool">Sequelize</text></g>
    </g>

    <!-- Tools -->
    <g transform="translate(1685 770)">
      <g><rect width="72" height="62" rx="14" fill="#F0F0F0"/><path d="M18 17l36 28M54 17L18 45" stroke="#111" stroke-width="5"/><text x="21" y="92" class="tool">Git</text></g>
      <g transform="translate(110 0)"><rect width="72" height="62" rx="14" fill="#F0F0F0"/><circle cx="36" cy="31" r="19" fill="#111"/><text x="7" y="92" class="tool">GitHub</text></g>
      <g transform="translate(220 0)"><rect width="72" height="62" rx="14" fill="#F0F0F0"/><path d="M36 16L55 47H17L36 16Z" fill="#111"/><text x="8" y="92" class="tool">Vercel</text></g>
    </g>
