    <circle cx="1710" cy="112" r="22" fill="#F7F7F7"/>
    <path d="M1697 111c0-8 6-14 14-14s14 6 14 14c0 6-3 10-8 13l2 7-8-4-8 4 2-7c-5-3-8-7-8-13Z" fill="#111"/>
    <text x="1750" y="106" fill="#F1F1F1" font-size="18" font-weight="700">Open Source</text>
    <text x="1750" y="130" fill="#9F9F9F" font-size="15">Build · Share · Grow</text>

    <rect x="930" y="555" width="270" height="82" rx="18" fill="#111" stroke="#3A3A3A" stroke-width="2"/>
    <rect x="955" y="575" width="48" height="42" rx="9" fill="#1E1E1E"/>
    <text x="966" y="604" fill="#F5F5F5" class="mono" font-size="25">&lt;/&gt;</text>
    <text x="1025" y="587" fill="#F1F1F1" font-size="16">Clean Code.</text>
    <text x="1025" y="611" fill="#F1F1F1" font-size="16">Better Products.</text>
  </g>

  <!-- SKILLS STRIP -->
  <rect y="700" width="2000" height="200" fill="#FAFAFA"/>
  <line x1="515" y1="732" x2="515" y2="875" stroke="#D5D5D5"/>
  <line x1="980" y1="732" x2="980" y2="875" stroke="#D5D5D5"/>
  <line x1="1325" y1="732" x2="1325" y2="875" stroke="#D5D5D5"/>
  <line x1="1648" y1="732" x2="1648" y2="875" stroke="#D5D5D5"/>

